schema: agentic.proof_estate.v5
baseline_report: reports/test-governance/quillric-baseline.json
audit_ledger: reports/test-governance/quillric-decisions.jsonl
witness_ledger: reports/test-governance/quillric-witnesses.jsonl
adoption:
  mode: bounded
  reason: 'Initial Starter 1.9.0 retrofit inventory: every product and inherited proof stays executable
    and pending local review. Review proceeds in bounded batches when a concrete signal (changed behavior,
    an escaped defect, confusing failures or cost growth) names the affected contract; no whole-estate
    re-witness, rewrite or deletion.'
hang_timeout_seconds: 1800
mutation:
  tool: null
  reason: No mutation survey has been requested or qualified for Quillric; focused authoring witnesses
    are separate.
critical_risks:
  custody:
    state: applicable
    direct_proof: pytest:tests/test_multioperator.py::test_transition_and_maintenance_refuse_false_state
  authority:
    state: applicable
    direct_proof: pytest:tests/test_multioperator.py::test_transition_and_maintenance_refuse_false_state
  concurrency:
    state: applicable
    direct_proof: pytest:tests/test_security.py::ExplicitCredentialTests::test_concurrent_calls_keep_clients_and_credentials_separate
  atomicity:
    state: applicable
    direct_proof: pytest:tests/test_transcribe_cli.py::PipelineTests::test_force_keeps_existing_package_when_replacement_fails
  corruption:
    state: applicable
    direct_proof: pytest:tests/test_package.py::PackageTests::test_altered_evidence_is_refused
  recovery:
    state: applicable
    direct_proof: pytest:tests/test_transcribe_cli.py::PipelineTests::test_api_failure_removes_partial_package
  security:
    state: applicable
    direct_proof: pytest:tests/test_security.py::JsonApiSecurityTests::test_real_opener_redirect_chain_never_restores_credentials
  public-contract:
    state: applicable
    direct_proof: pytest:tests/test_package.py::PackageTests::test_package_records_source_identity_and_is_loadable
  schema:
    state: applicable
    direct_proof: pytest:tests/test_config.py::ConfigurationTests::test_invalid_schema_rejects_types_ranges_unknown_fields_and_authority
  core-success:
    state: applicable
    direct_proof: pytest:tests/test_transcribe_cli.py::PipelineTests::test_pipeline_creates_complete_default_package_atomically
  deploy:
    state: not-applicable
    rationale: Quillric has no deployment surface; releases are GitHub release artifacts qualified by
      CI.
    activation_trigger: An approved hosted service, Pages site or other live deployment surface is added.
witness_failure_lines: '^E '
