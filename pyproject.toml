[project]
name = "transcribe"
version = "1.1.0"
description = "Audio or video to a self-contained, diarized transcription package with source identity and an assignable speaker table."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Wolf McNally", email = "wolf@wolfmcnally.com" }]
dependencies = []

[project.scripts]
transcribe = "transcribe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcribe"]
