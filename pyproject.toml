[project]
name = "quillric"
version = "1.4.1"
description = "Audio or video to a self-contained, diarized transcription package with source identity and an assignable speaker table."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Wolf McNally", email = "wolf@wolfmcnally.com" }]
dependencies = []

[project.optional-dependencies]
fingerprint = ["numpy>=1.24"]

[project.scripts]
transcribe = "transcribe.cli:main"

[project.urls]
Homepage = "https://github.com/wolfmcnally/quillric"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcribe"]
