name: Release qualification
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Install test and build dependencies
        run: python -m pip install '.[fingerprint]' build
      - name: Full offline suite (no skips)
        run: |
          python - <<'PY'
          import unittest
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tests'))
          raise SystemExit(0 if result.wasSuccessful() and not result.skipped else 1)
          PY
      - name: Build release distributions
        run: python -m build
      - name: Validate archive metadata and installed wheel
        run: |
          python .github/scripts/verify_dist.py
          python -m venv /tmp/quillric-wheel
          /tmp/quillric-wheel/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/quillric-wheel/bin/transcribe --version
          /tmp/quillric-wheel/bin/python -c 'import importlib.metadata as m, transcribe; from transcribe.cli import VERSION; assert m.version("quillric") == VERSION == "0.1.0"; assert not any(d.metadata["Name"].lower() == "transcribe" for d in m.distributions()); assert callable(transcribe.transcribe_file)'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quillric-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
